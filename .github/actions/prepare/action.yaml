description: Prepares the repo for a typical CI job

name: Setup

runs:
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - uses: actions/setup-node@v6
      with:
        cache: pnpm
        node-version: lts/*
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
