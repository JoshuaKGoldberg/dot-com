description: Prepares the repo for a typical CI job

name: Setup

runs:
  steps:
    - uses: pnpm/action-setup@v5
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        cache: pnpm
        node-version: lts/*
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
