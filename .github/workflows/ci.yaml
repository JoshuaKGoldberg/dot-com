jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - parallel:
          - name: Astro Check
            run: pnpm check
          - name: Dedupe Check
            run: pnpm dedupe --check
          - name: Format Check
            run: pnpm format --list-different
          - name: Lint GitHub Actions
            uses: zizmorcore/zizmor-action@v0.8.1
            with:
              advanced-security: "false"
              annotations: "true"
          - name: Lint Knip
            run: pnpm lint:knip
          - name: Lint Links
            run: pnpm lint:links
          - name: Lint Spelling
            run: pnpm lint:spelling

  engines_check:
    name: Engines Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          node-version: 22.23.4
      - run: pnpm install --prod --engine-strict --ignore-scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm astro sync
      - run: pnpm lint

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm astro sync
      - run: pnpm tsc
      - run: pnpm tsc --project worker

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read
